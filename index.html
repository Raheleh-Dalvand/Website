<style>
/* =====================================================
   ABOUT ME SECTION - REDESIGNED
===================================================== */

.about-me {
  display: grid;
  grid-template-columns: 1.7fr 0.8fr;
  gap: 40px;
  align-items: center;

  padding: 42px 46px;
  margin-bottom: 40px;

  background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
  border: 1px solid #dbe4f0;
  border-radius: 18px;

  box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);

  position: relative;
  overflow: hidden;
}

.about-me::before {
  content: "";
  position: absolute;

  width: 180px;
  height: 180px;

  right: -50px;
  top: -60px;

  border-radius: 50%;

  background: rgba(37, 99, 235, 0.06);
}

.about-left {
  position: relative;
  z-index: 1;
}

.about-eyebrow {
  display: inline-block;

  margin-bottom: 12px;

  color: #2563eb;

  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;

  text-transform: uppercase;
}

.about-title {
  margin: 0 0 10px;

  font-family: 'Poppins', sans-serif;
  font-size: 30px;
  font-weight: 700;

  line-height: 1.25;

  color: #0f172a;
}

.about-subtitle {
  margin: 0 0 18px;

  font-size: 17px;
  font-weight: 600;

  color: #1d4ed8;
}

.about-description {
  margin: 0;

  max-width: 850px;

  font-size: 15px;
  line-height: 1.75;

  color: #64748b;
}

.about-right {
  position: relative;
  z-index: 1;

  background: #0f172a;

  border-radius: 14px;

  padding: 26px 24px;

  color: white;

  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
}

.about-right h3 {
  margin: 0 0 18px;

  font-family: 'Poppins', sans-serif;

  font-size: 15px;
  font-weight: 600;

  color: #cbd5e1;

  letter-spacing: 0.8px;
}

.stack-item {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 12px 0;

  border-bottom: 1px solid rgba(255, 255, 255, 0.08);

  font-size: 14px;
}

.stack-item:last-child {
  border-bottom: none;
}

.stack-item span:first-child {
  color: #f8fafc;
  font-weight: 600;
}

.stack-item span:last-child {
  color: #60a5fa;
  font-size: 13px;
}

@media (max-width: 900px) {
  .about-me {
    grid-template-columns: 1fr;
    gap: 24px;
  }

  .about-right {
    max-width: 100%;
  }
}

@media (max-width: 768px) {
  .about-me {
    padding: 30px 24px;
  }

  .about-title {
    font-size: 24px;
  }

  .about-subtitle {
    font-size: 15px;
  }

  .about-description {
    font-size: 14px;
  }
}
</style>
